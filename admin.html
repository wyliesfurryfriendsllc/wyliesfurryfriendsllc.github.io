<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Wylie Furry Friends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">

<!-- Login screen -->
<div id="loginScreen" class="admin-login">
    <div class="login-card">
        <div class="login-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="6" cy="6.5" rx="2" ry="2.5"/><ellipse cx="18" cy="6.5" rx="2" ry="2.5"/><ellipse cx="10.5" cy="3" rx="1.5" ry="2"/><ellipse cx="13.5" cy="3" rx="1.5" ry="2"/><path d="M12 21c-4 0-7-2-7-5.5 0-2 1.5-4 3.5-5.5h7c2 1.5 3.5 3.5 3.5 5.5C19 19 16 21 12 21z"/></svg>
            Wylie Furry Friends
        </div>
        <h2>Admin Panel</h2>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
        </div>
        <p id="loginError" class="login-error" style="display:none">Incorrect password</p>
        <button class="admin-btn-primary" onclick="login()">Sign In</button>
    </div>
</div>

<!-- Admin panel -->
<div id="adminPanel" style="display:none">
    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="admin-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="6" cy="6.5" rx="2" ry="2.5"/><ellipse cx="18" cy="6.5" rx="2" ry="2.5"/><ellipse cx="10.5" cy="3" rx="1.5" ry="2"/><ellipse cx="13.5" cy="3" rx="1.5" ry="2"/><path d="M12 21c-4 0-7-2-7-5.5 0-2 1.5-4 3.5-5.5h7c2 1.5 3.5 3.5 3.5 5.5C19 19 16 21 12 21z"/></svg>
                Admin Panel
            </div>
            <div class="admin-header-actions">
                <a href="index.html" target="_blank" class="admin-btn-secondary">View Site</a>
                <button class="admin-btn-secondary" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <div class="admin-section">
            <div class="admin-section-header">
                <div>
                    <h2 class="admin-section-title">Gallery Photos</h2>
                    <p class="admin-section-sub">Drag photos to reorder. Changes save automatically.</p>
                </div>
                <div class="admin-actions">
                    <button class="admin-btn-secondary" onclick="resetOrder()">Reset Order</button>
                    <button class="admin-btn-primary" onclick="saveOrder()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Save Order
                    </button>
                </div>
            </div>
            <p id="saveStatus" class="save-status" style="display:none"></p>
            <div class="admin-gallery" id="adminGallery"></div>
        </div>
    </main>
</div>

<script src="gallery.js"></script>
<script src="admin.js"></script>
</body>
</html>
